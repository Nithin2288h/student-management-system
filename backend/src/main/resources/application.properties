server.port=8080

# Database Configuration with Environment Variables
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:student_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:student_user}
spring.datasource.password=${DB_PASSWORD:student_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.access=read-only
management.endpoint.health.show-details=always

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.com.sms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Enable Prometheus HTTP request latency histograms
management.metrics.distribution.percentiles-histogram.http.server.requests=true
