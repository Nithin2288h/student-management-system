apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sms-boot4-test
  labels:
    app: frontend-boot4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-boot4
  template:
    metadata:
      labels:
        app: frontend-boot4
    spec:
      containers:
        - name: frontend
          image: bunny2288h/student-management-system-frontend:aefc798
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
