apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sms-boot4-test
  labels:
    app: backend-boot4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-boot4
  template:
    metadata:
      labels:
        app: backend-boot4
    spec:
      containers:
        - name: backend
          image: bunny2288h/student-management-system-backend:aefc798
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: sms-boot4-db-secret
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
