apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sms-boot4-test
  labels:
    app: mysql-boot4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-boot4
  template:
    metadata:
      labels:
        app: mysql-boot4
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              protocol: TCP
          envFrom:
            - secretRef:
                name: sms-boot4-db-secret
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"'
            failureThreshold: 12
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-boot4-pvc
